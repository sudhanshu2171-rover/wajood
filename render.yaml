services:
  - type: web
    name: wajood-api
    runtime: node
    plan: free
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix backend && npm run build --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/_healthcheck
    envVars:
      - key: KITE_API_KEY
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false
      - key: KITE_INDEX_TOKENS
        value: 256265,260105,257801,265
      - key: KITE_LIVE_TRADING_ENABLED
        value: "false"
      - key: KITE_STATIC_IP_READY
        value: "false"
      - key: GIFT_NIFTY_API_URL
        sync: false
